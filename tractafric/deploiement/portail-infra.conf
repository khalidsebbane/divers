# =============================================================================================
# Apache httpd : publication du portail d'infrastructure IRIUM iE (serveur GENERATEUR)
# Copier dans /etc/httpd/conf.d/portail-infra.conf, adapter les lignes marquées « A ADAPTER », puis :
#   dnf/yum install -y httpd mod_ssl mod_ldap && apachectl configtest && systemctl enable --now httpd
# Le portail est une page statique régénérée toutes les 15 minutes : aucun code exécuté côté serveur.
# =============================================================================================
Listen 8443 https

<VirtualHost *:8443>
    # A ADAPTER
    ServerName portail-infra.tractafric.local
    # A ADAPTER : <PARTAGE>/portail
    DocumentRoot "/msdos/ks/tractafric/portail"

    SSLEngine on
    # A ADAPTER : certificat de l'autorité interne
    SSLCertificateFile    /etc/pki/tls/certs/portail-infra.crt
    SSLCertificateKeyFile /etc/pki/tls/private/portail-infra.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Accès réservé à la DSI : authentification Active Directory (groupe GG_Portail_Infra)
    # A ADAPTER
    <Directory "/msdos/ks/tractafric/portail">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        AuthType Basic
        AuthName "Portail infrastructure IRIUM iE - compte Windows"
        AuthBasicProvider ldap
        # A ADAPTER
        AuthLDAPURL "ldaps://dc1.tractafric.local:636/DC=tractafric,DC=local?sAMAccountName?sub?(objectClass=user)"
        # A ADAPTER
        AuthLDAPBindDN "CN=svc-portail,OU=Comptes de service,DC=tractafric,DC=local"
        AuthLDAPBindPassword "exec:/bin/cat /etc/httpd/conf.d/.mdp_svc_portail"
        AuthLDAPMaxSubGroupDepth 5
        # A ADAPTER
        Require ldap-group CN=GG_Portail_Infra,OU=Groupes,DC=tractafric,DC=local
        # Sans Active Directory : remplacer les lignes AuthBasicProvider à Require ci-dessus par
        #   AuthBasicProvider file
        #   AuthUserFile /etc/httpd/conf.d/.portail-infra.htpasswd     (htpasswd -c -B <fichier> prenom.nom)
        #   Require valid-user
    </Directory>
    # Seule la page du portail est servie (pas les données brutes du partage)
    <LocationMatch "^/(?!index\.html$|$)">
        Require all denied
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"
    ErrorLog  logs/portail-infra_erreurs.log
    CustomLog logs/portail-infra_acces.log combined
</VirtualHost>
# Certificat autosigné provisoire (si l'autorité interne n'est pas encore disponible) :
#   openssl req -x509 -newkey rsa:3072 -nodes -days 825 -subj "/CN=portail-infra.tractafric.local" \
#     -keyout /etc/pki/tls/private/portail-infra.key -out /etc/pki/tls/certs/portail-infra.crt
# SELinux, si le partage est un NFS : setsebool -P httpd_use_nfs 1
# Pare-feu : firewall-cmd --permanent --add-port=8443/tcp && firewall-cmd --reload
