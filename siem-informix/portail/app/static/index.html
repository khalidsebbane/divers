<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail SIEM</title>
<link rel="icon" href="/marque/logo">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/marque.css">
</head>
<body>
<div class="app">
  <nav class="menu" id="menu">
    <div class="marque"><img id="logo" alt="" hidden><b id="marque-nom">SIEM</b><small id="marque-st">Traçabilité système, base et applicatif</small></div>
    <a href="#/tableau" data-vue="tableau"><span class="ico">▦</span>Tableau de bord</a>
    <a href="#/utilisateurs" data-vue="utilisateurs"><span class="ico">☺</span>Utilisateurs</a>
    <a href="#/recherche" data-vue="recherche"><span class="ico">⌕</span>Recherche</a>
    <a href="#/alertes" data-vue="alertes"><span class="ico">!</span>Alertes</a>
    <a href="#/assistant" data-vue="assistant"><span class="ico">✦</span>Assistant</a>
    <div class="section admin-seul" hidden>Administration</div>
    <a href="#/collecte" data-vue="collecte" class="admin-seul" hidden><span class="ico">⇄</span>Collecte</a>
    <a href="#/postes" data-vue="postes" class="admin-seul" hidden><span class="ico">⌂</span>Postes</a>
    <a href="#/comptes" data-vue="comptes" class="admin-seul" hidden><span class="ico">⚿</span>Comptes locaux</a>
    <a href="#/journal" data-vue="journal" class="admin-seul" hidden><span class="ico">☰</span>Journal d'audit</a>
    <a href="#/parametres" data-vue="parametres" class="admin-seul" hidden><span class="ico">⚙</span>Paramètres</a>
    <div class="pied" id="version"></div>
  </nav>
  <div class="contenu">
    <header class="barre">
      <button class="bouton menu-mobile" id="btn-menu" aria-label="Menu">☰</button>
      <h1 id="titre">Tableau de bord</h1>
      <div class="periode">
        <select id="periode" aria-label="Période">
          <option value="jour">Aujourd'hui</option>
          <option value="7">7 derniers jours</option>
          <option value="30" selected>30 derniers jours</option>
          <option value="mois">Mois en cours</option>
          <option value="mois-1">Mois précédent</option>
          <option value="perso">Personnalisée</option>
        </select>
        <input type="date" id="debut" aria-label="Début" hidden>
        <input type="date" id="fin" aria-label="Fin" hidden>
        <button class="bouton" id="btn-theme" title="Thème clair / sombre">◐</button>
        <button class="bouton principal" id="btn-assistant">✦ Assistant</button>
        <div class="qui" id="qui"><span class="ini" id="qui-ini"></span><span class="nom" id="qui-nom"></span>
          <button id="btn-sortir" title="Se déconnecter">Déconnexion</button></div>
      </div>
    </header>
    <main id="vue"></main>
  </div>
</div>
<aside class="tiroir" id="tiroir" aria-label="Assistant">
  <div class="tete"><h2>Assistant</h2><button class="bouton" id="btn-fermer">✕</button></div>
  <div id="tiroir-chat" class="assistant"></div>
</aside>
<div class="infobulle" id="infobulle" role="tooltip"></div>
<script src="/static/app.js"></script>
</body>
</html>
