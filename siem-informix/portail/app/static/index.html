<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail SIEM Informix</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%231c5cab%27/%3E%3Cpath d=%27M4 11V5h2v6zm3 0V3h2v8zm3 0V7h2v4z%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <nav class="menu" id="menu">
    <div class="marque">SIEM Informix<small>Traçabilité système &amp; base</small></div>
    <a href="#/tableau" data-vue="tableau"><span class="ico">▦</span>Tableau de bord</a>
    <a href="#/utilisateurs" data-vue="utilisateurs"><span class="ico">☺</span>Utilisateurs</a>
    <a href="#/recherche" data-vue="recherche"><span class="ico">⌕</span>Recherche</a>
    <a href="#/alertes" data-vue="alertes"><span class="ico">!</span>Alertes</a>
    <a href="#/postes" data-vue="postes"><span class="ico">⌂</span>Postes</a>
    <a href="#/assistant" data-vue="assistant"><span class="ico">✦</span>Assistant</a>
    <div class="pied" id="qui"></div>
  </nav>
  <div class="contenu">
    <header class="barre">
      <button class="bouton menu-mobile" id="btn-menu" aria-label="Menu">☰</button>
      <h1 id="titre">Tableau de bord</h1>
      <div class="periode">
        <select id="periode" aria-label="Période">
          <option value="jour">Aujourd'hui</option>
          <option value="7">7 derniers jours</option>
          <option value="30" selected>30 derniers jours</option>
          <option value="mois">Mois en cours</option>
          <option value="mois-1">Mois précédent</option>
          <option value="perso">Personnalisée</option>
        </select>
        <input type="date" id="debut" aria-label="Début" hidden>
        <input type="date" id="fin" aria-label="Fin" hidden>
        <button class="bouton" id="btn-theme" title="Thème clair / sombre">◐</button>
        <button class="bouton principal" id="btn-assistant">✦ Assistant</button>
      </div>
    </header>
    <main id="vue"></main>
  </div>
</div>
<aside class="tiroir" id="tiroir" aria-label="Assistant">
  <div class="tete"><h2>Assistant</h2><button class="bouton" id="btn-fermer">✕</button></div>
  <div id="tiroir-chat" class="assistant"></div>
</aside>
<div class="infobulle" id="infobulle" role="tooltip"></div>
<script src="/static/app.js"></script>
</body>
</html>
